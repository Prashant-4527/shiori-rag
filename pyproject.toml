[project]
name = "shiori-rag"
version = "0.1.0"
description = "Bilingual (JA/EN) RAG over METI trade white papers, with page-level citations"
readme = "README.md"
authors = [
    { name = "Prashant", email = "257387003+Prashant-4527@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.4.6",
    "ollama>=0.6.3",
    "pdfplumber>=0.11.10",
    "pymupdf>=2.0",
    "pypdf>=6.21.2",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
shiori-rag = "shiori_rag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
